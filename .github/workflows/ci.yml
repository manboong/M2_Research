name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify synthetic pipeline
        run: |
          python -m research_cli run-demo --articles 8 --comments 40 --run-id ci-check --output-dir /tmp/m2-research-ci
          test -f /tmp/m2-research-ci/manifest.json
